<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup Security Question</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #0a0a0a; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
  .card { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 36px; width: 100%; max-width: 420px; }
  h2 { color: #00ff88; margin-bottom: 8px; font-size: 1.3rem; }
  p { color: #888; font-size: 0.85rem; margin-bottom: 24px; }
  label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 6px; }
  select, input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 10px 12px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; margin-bottom: 16px; }
  select:focus, input:focus { outline: none; border-color: #00ff88; }
  button { width: 100%; background: #00ff88; color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: bold; font-size: 0.95rem; cursor: pointer; }
  button:hover { background: #00cc6a; }
  .flash { padding: 10px 14px; border-radius: 4px; margin-bottom: 16px; font-size: 0.85rem; background: #1a1a00; border: 1px solid #ffcc00; color: #ffcc00; }
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Security Setup Required</h2>
  <p>Your account needs a security question set up for account recovery. This is a one-time step.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <label>Security Question</label>
    <select name="security_question" required>
      {% for q in security_questions %}
        <option value="{{ q }}">{{ q }}</option>
      {% endfor %}
    </select>
    <label>Your Answer</label>
    <input type="text" name="security_answer" placeholder="Enter your answer" required autocomplete="off">
    <button type="submit">Save & Continue</button>
  </form>
</div>
</body>
</html>
