<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.card { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 36px; width: 100%; max-width: 420px; }
h2 { color: #00ff88; margin-bottom: 8px; font-size: 1.2rem; }
p { color: #666; font-size: 0.82rem; margin-bottom: 24px; }
label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 6px; }
input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 10px 12px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; margin-bottom: 16px; }
input:focus { outline: none; border-color: #00ff88; }
button { width: 100%; background: #00ff88; color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
button:hover { background: #00cc6a; }
.flash { padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 0.82rem; background: #220000; border: 1px solid #ff4444; color: #ff8888; }
a { color: #00ff88; font-size: 0.8rem; }
</style>
</head>
<body>
<div class="card">
  <h2>🔑 Reset Password</h2>
  <p>Enter your username and the recovery key you saved when you registered.</p>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" placeholder="Your username" required>
    <label>Recovery Key</label>
    <input type="text" name="recovery_key" placeholder="XXXX-XXXX-XXXX-XXXX" required autocomplete="off">
    <button type="submit">Verify & Continue</button>
  </form>
  <br>
  <a href="{{ url_for('auth.login') }}">← Back to Login</a>
</div>
</body>
</html>
