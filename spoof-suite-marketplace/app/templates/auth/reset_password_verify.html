<!DOCTYPE html>
<html>
<head>
    <title>Verify Identity</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { background-image: url('https://media.istockphoto.com/id/912299634/photo/computer-crime-concept.jpg?s=612x612&w=0&k=20&c=JOYSw69V4tr2hvnAt3HsOEbyXAoSXYulHrh8ifqqJXk='); background-size: cover; background-repeat: no-repeat; background-position: center; color: #fff; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; }
        .form-box { background: rgba(0,0,0,0.18); padding: 32px; border-radius: 12px; display: inline-block; margin-top: 80px; min-width: 280px; max-width: 95vw; box-sizing: border-box; }
        input, button { padding: 10px 18px; border-radius: 8px; border: none; font-size: 16px; margin: 8px 0; width: 90%; max-width: 350px; box-sizing: border-box; display: block; margin-left: auto; margin-right: auto; }
        button { background: #2b6cb0; color: #fff; font-weight: bold; }
        a { color: #bee3f8; text-decoration: underline; font-size: 15px; display: block; margin-top: 12px; }
    </style>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="form-box">
        <h2>Verify Identity</h2>
        <p style="color:#bee3f8; font-size:14px; margin-bottom:8px;">Account: <strong>{{ username }}</strong></p>
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div style="color:#ff6b6b; margin-bottom:10px; font-weight:bold;">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <div style="background:rgba(30,41,59,0.8); border-radius:8px; padding:14px; margin-bottom:16px; color:#ffd700; font-weight:bold; font-size:15px;">
            {{ question }}
        </div>
        <form method="post">
            <input name="security_answer" placeholder="Your answer" required autocomplete="off">
            <button type="submit">Verify</button>
        </form>
        <a href="{{ url_for('auth.reset_password_request') }}">&larr; Back</a>
    </div>
</body>
</html>
