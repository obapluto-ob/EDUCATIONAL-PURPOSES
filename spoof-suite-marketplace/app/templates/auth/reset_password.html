<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #0a0a0a; color: #e0e0e0; font-family: 'Courier New', monospace; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
.card { background: #111; border: 1px solid #2a2a2a; border-radius: 8px; padding: 36px; width: 100%; max-width: 420px; }
h2 { color: #00ff88; margin-bottom: 24px; font-size: 1.2rem; }
label { display: block; font-size: 0.78rem; color: #aaa; margin-bottom: 6px; }
input { width: 100%; background: #1a1a1a; border: 1px solid #333; color: #e0e0e0; padding: 10px 12px; border-radius: 4px; font-family: inherit; font-size: 0.9rem; margin-bottom: 16px; }
input:focus { outline: none; border-color: #00ff88; }
button { width: 100%; background: #00ff88; color: #000; border: none; padding: 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
.flash { padding: 10px; border-radius: 4px; margin-bottom: 16px; font-size: 0.82rem; background: #221100; border: 1px solid #ffaa00; color: #ffaa00; }
</style>
</head>
<body>
<div class="card">
  <h2>🔐 Set New Password</h2>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash">{{ msg }}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <label>New Password</label>
    <input type="password" name="password" required>
    <label>Confirm Password</label>
    <input type="password" name="confirm_password" required>
    <button type="submit">Update Password</button>
  </form>
</div>
</body>
</html>
